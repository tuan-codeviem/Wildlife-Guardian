<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wildlife Guardian | Reset Password</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="login-section">
        <div class="logo">
            <span class="logo-icon">🦁</span>
            <h2>Wildlife Guardian</h2>
        </div>
        <h1>Reset Password</h1>
        <p class="subtitle">Enter your email to receive a password reset link.</p>

        <form id="forgotPasswordForm">
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="admin@gmail.com" required autofocus>
            </div>

            <button type="submit" class="login-btn" id="resetBtn">Send Reset Link</button>
        </form>
      
        <p class="switch-page">
            Remember your password? <a href="login.html">Sign In</a>
        </p>
    </div>

    <div class="info-section">
        <div class="info-content">
            <h2>Account Recovery</h2>
            <p>Don't worry! It happens to the best of us. Enter your email and we'll help you get back to protecting wildlife.</p>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-number">24/7</div>
                    <div class="stat-label">Support</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">Secure</div>
                    <div class="stat-label">Process</div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script src="forgot.js"></script>
</body>
</html>
