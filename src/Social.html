<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wildlife Guardian - Social</title>
    <link rel="stylesheet" href="Social.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="logo-section">
        <img
          src="my-logo.png"
          alt="Wildlife Guardian Logo"
          class="custom-logo"
        />
        <span class="brand-name">Wildlife Guardian</span>
      </div>

      <nav class="nav-links">
        <input type="radio" id="tab-home" name="main-nav" />
        <label for="tab-home" class="nav-item">Home</label>

        <input type="radio" id="tab-map" name="main-nav" />
        <label for="tab-map" class="nav-item">Rescue Map</label>

        <input type="radio" id="tab-social" name="main-nav" checked />
        <label for="tab-social" class="nav-item">Social</label>

        <input type="radio" id="tab-species" name="main-nav" />
        <label for="tab-species" class="nav-item">Species</label>

        <input type="radio" id="tab-contact" name="main-nav" />
        <label for="tab-contact" class="nav-item">Contact</label>
      </nav>

      <div class="action-buttons">
        <button class="btn btn-report">Report Now</button>
        <button class="btn btn-login">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            <polyline points="10 17 15 12 10 7"></polyline>
            <line x1="15" y1="12" x2="3" y2="12"></line>
          </svg>
          Login
        </button>
      </div>
    </header>
  </body>
</html>
