    <!-- Phần Build sẵn html của Unity tạo ra -->

    <!--///////////////////////////CHATBOTAI////////////////////////////-->
    <div class="chat-bot-AI">
            
            <div class="AIassit">
                <svg class="pixel-phoenix" viewBox="0 0 32 32" width="40" height="40">
                    <rect x="12" y="16" width="8" height="8" fill="#FF6B35" />
                    <rect x="14" y="12" width="4" height="4" fill="#FF6B35" />
                    <rect x="18" y="13" width="2" height="2" fill="#FFD93D" />
                    <rect x="15" y="13" width="2" height="2" fill="#1a1a1a" />
                    <rect class="wing" x="8" y="16" width="4" height="6" fill="#FF8C42" />
                    <rect class="wing" x="20" y="16" width="4" height="6" fill="#FF8C42" />
                    <rect x="10" y="24" width="2" height="4" fill="#FF6B35" />
                    <rect x="14" y="24" width="2" height="6" fill="#FFD93D" />
                    <rect x="18" y="24" width="2" height="4" fill="#FF6B35" />
                    <rect x="13" y="8" width="2" height="4" fill="#FFD93D" />
                    <rect x="15" y="6" width="2" height="6" fill="#FF6B35" />
                    <rect x="17" y="8" width="2" height="4" fill="#FFD93D" />
                </svg>
                <div class="sparkle-badge">
                    <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
                </div>
            </div>

            <div class="chatwindow">
                <div class="chat-header">
                    <div class="chat-header-info">
                        <div class="chat-avatar">
                            <svg viewBox="0 0 32 32" width="20" height="20">
                                <rect x="12" y="16" width="8" height="8" fill="#FF6B35" />
                                <rect x="14" y="12" width="4" height="4" fill="#FF6B35" />
                                <rect x="18" y="13" width="2" height="2" fill="#FFD93D" />
                                <rect x="15" y="13" width="2" height="2" fill="#1a1a1a" />
                                <rect x="8" y="16" width="4" height="6" fill="#FF8C42" />
                                <rect x="20" y="16" width="4" height="6" fill="#FF8C42" />
                            </svg>
                        </div>
                        <div class="chat-title-group">
                            <h3>Phoenix AI</h3>
                            <p>Wildlife Assistant</p>
                        </div>
                    </div>
                    <button class="close">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                    </button>
                </div>

                <div class="chat">
                    <div class="model">
                        <p>Hello! I'm Phoenix, your wildlife guardian assistant!</p>
                    </div>
                </div>

                <div class="inputarea">
                    <input type="text" placeholder="Ask Phoenix anything...">
                    <button>
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719"></path></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script type="importmap">
    {
    "imports": {
      "@google/genai": "https://esm.run/@google/genai"
    }
  }
</script>
