<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | EcoGuardian-Unity</title>
    <script>
      if (!localStorage.getItem("currentUser")) {
        sessionStorage.setItem("redirectAfterLogin", window.location.href);
        window.location.replace("../../Auth/login.html");
      }
    </script>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet" />
    <style>
      /* Đảm bảo game full màn hình iframe */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0d0d0d;
        font-family: 'Outfit', sans-serif;
      }
      
      #unity-container {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
      }
      
      #unity-canvas {
        width: 100% !important;
        height: 100% !important;
        background: #0d0d0d;
      }

      /* Ẩn phần footer mặc định của Unity vì ta muốn full màn hình */
      #unity-footer {
        display: none;
      }

      /* Lớp phủ yêu cầu xoay màn hình (chỉ hiện khi ở Portrait trên Mobile) */
      #rotate-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background-color: #05140a;
        color: white;
        z-index: 9999;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
      }
      
      #rotate-overlay svg {
        animation: rotatePhone 1.5s infinite ease-in-out alternate;
      }

      @keyframes rotatePhone {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(-90deg); }
      }

      #rotate-overlay h2 {
        font-weight: 800;
        margin-top: 15px;
        margin-bottom: 5px;
      }

      #rotate-overlay p {
        font-weight: 300;
        color: #a8b2ac;
        margin: 0;
      }

      /* Kích hoạt lớp phủ khi ở màn hình dọc */
      @media screen and (orientation: portrait) and (max-width: 932px) {
        #rotate-overlay {
          display: flex;
        }
        #unity-container {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- Lớp phủ yêu cầu xoay màn hình -->
    <div id="rotate-overlay">
      <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 10px;">
        <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
        <line x1="12" y1="18" x2="12.01" y2="18"></line>
      </svg>
      <h2>Vui lòng xoay ngang màn hình</h2>
      <p>Trải nghiệm tốt nhất khi chơi ngang (Landscape mode).</p>
    </div>

    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">EcoGuardian-Unity</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/New.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/New.data",
        frameworkUrl: buildUrl + "/New.framework.js",
        codeUrl: buildUrl + "/New.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "EcoGuardian-Unity",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;

      } else {
        // Desktop style: Render the game canvas full screen in iframe
        canvas.style.width = "100%";
        canvas.style.height = "100%";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var myUnityInstance = null;

      // Hàm gửi dữ liệu màn chơi cho Unity gọi
      window.RequestDataFromWeb = function() {
        const userString = localStorage.getItem("currentUser");
        if (!userString) {
          console.warn("User is not logged in! Game progress cannot be loaded.");
          return;
        }
        
        const currentUser = JSON.parse(userString);
        const userId = currentUser._id || currentUser.userId;
        
        // Đổi localhost thành window.location.hostname để chạy mượt trên mạng LAN hoặc server ngoài
        const _base = (location.hostname === 'localhost' || location.hostname === '127.0.0.1') ? 'http://localhost:3000' : location.origin;
        fetch(`${_base}/api/users/game-progress/${userId}`)
          .then(res => res.json())
          .then(data => {
              if (myUnityInstance) {
                  myUnityInstance.SendMessage('Save_Manager', 'OnReceiveDataFromWeb', JSON.stringify(data));
              } else {
                  console.error("Unity Instance not ready yet.");
              }
          })
          .catch(err => console.error("Error fetching game progress:", err));
      };

      // Hàm nhận dữ liệu từ Unity và cập nhật lên Server
      window.ReceiveDataFromUnity = function(jsonDataString) {
        const userString = localStorage.getItem("currentUser");
        if (!userString) {
          console.warn("User is not logged in! Game progress cannot be saved.");
          return;
        }

        const currentUser = JSON.parse(userString);
        const userId = currentUser._id || currentUser.userId;
        const data = JSON.parse(jsonDataString);

        const _base2 = (location.hostname === 'localhost' || location.hostname === '127.0.0.1') ? 'http://localhost:3000' : location.origin;
        fetch(`${_base2}/api/users/update-game-progress/${userId}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(data)
        })
        .then(res => res.json())
        .then(response => {
          if (response.success) {
            console.log("Progress saved successfully!");
          } else {
            console.error("Failed to save progress:", response.message);
          }
        })
        .catch(err => console.error("Error saving game progress:", err));
      };

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                myUnityInstance = unityInstance; // Lưu lại Unity Instance
                document.querySelector("#unity-loading-bar").style.display = "none";
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
